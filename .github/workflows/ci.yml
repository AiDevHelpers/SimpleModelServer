name: CI and Release

# Tests run on every push, pull request, and manual run. Every run also builds the installer.
# Pushes to dev (prerelease) and main (stable) publish a release tagged v<version>.
# Pull requests from this repo publish a prerelease tagged v<version>-pr<number>, so PRs never share a tag.
# The version comes from version.json through nbgv, and CI creates the tag.

on:
  push:
    branches: [ dev, main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs. Never cancel a run on a branch push, since it may be publishing.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_XMLDOC_MODE: skip
  # Latest SperryDev.Logger prerelease on wip; latest release on main and on pull requests into main.
  SperryLoggerVersion: ${{ (github.ref_name == 'main' || github.base_ref == 'main') && '0.*' || '0.*-*' }}

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Nerdbank.GitVersioning needs full history to compute the version.
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload (chat app)
        run: dotnet workload install maui-windows

      - name: Add GitHub Packages NuGet source (SperryDev.Logger)
        shell: pwsh
        env:
          NUGET_READ_TOKEN: ${{ secrets.TOKENSAVER_READ_TOKEN }}
        run: |
          if (-not $env:NUGET_READ_TOKEN) {
            throw "TOKENSAVER_READ_TOKEN is not set. It must be a classic PAT with read:packages."
          }
          dotnet nuget add source "https://nuget.pkg.github.com/rsperry79/index.json" --name github --username rsperry79 --password $env:NUGET_READ_TOKEN --store-password-in-clear-text

      - name: Restore
        # The chat app's Windows TFM needs the win-x64 runtime pack at build time. Restoring for
        # the RID downloads it; a plain restore relies on a warm local cache, which runners lack.
        run: dotnet restore SimpleModelServer.slnx --runtime win-x64

      - name: Vulnerability audit
        shell: pwsh
        # `dotnet list package --vulnerable` can exit 0 when it finds issues, so check the output too.
        run: |
          $out = dotnet list SimpleModelServer.slnx package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0 -or $out -match 'has the following vulnerable packages') {
            throw "Vulnerable NuGet packages found."
          }

      - name: Vulnerability audit
        shell: pwsh
        # `dotnet list package --vulnerable` can exit 0 when it finds issues, so check the output too.
        run: |
          $out = dotnet list SimpleModelServer.slnx package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0 -or $out -match 'has the following vulnerable packages') {
            throw "Vulnerable NuGet packages found."
          }

      - name: Build
        run: dotnet build SimpleModelServer.slnx -c Release --no-restore

      - name: Format check
        # Enforces the .editorconfig (tabs for C#, LF, UTF-8 without BOM).
        run: dotnet format SimpleModelServer.slnx --verify-no-changes --no-restore

      - name: Test
        run: >-
          dotnet test SimpleModelServer.slnx -c Release --no-build
          --report-trx
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14

  check-js:
    name: Check JavaScript (VS Code extension)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/Extensions/SimpleModelServer.Extensions.VSCode
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Extensions/SimpleModelServer.Extensions.VSCode/package-lock.json

      - name: Install (from lockfile)
        run: npm ci

      - name: Check (typecheck, lint, unit tests)
        run: npm run check

  quality-gate:
    name: Quality gate (format, warnings, audit, coverage floor)
    # Runs on every push and pull request. Failing this blocks release assets (see installer.needs).
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Nerdbank.GitVersioning needs full history to compute the version.
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload (chat app)
        run: dotnet workload install maui-windows

      - name: Install ReportGenerator
        # Pinned to the version the coverage floor was measured with.
        run: dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.12

      - name: Restore
        run: dotnet restore SimpleModelServer.slnx --runtime win-x64

      - name: Format check
        run: dotnet format SimpleModelServer.slnx --verify-no-changes --no-restore

      - name: Build (warnings are errors in Release)
        run: dotnet build SimpleModelServer.slnx -c Release --no-restore

      - name: Vulnerability audit
        shell: pwsh
        # `dotnet list package --vulnerable` can exit 0 when it finds issues, so check the output too.
        run: |
          $out = dotnet list SimpleModelServer.slnx package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0 -or $out -match 'has the following vulnerable packages') {
            throw "Vulnerable NuGet packages found."
          }

      - name: Test with coverage
        run: >-
          dotnet test SimpleModelServer.slnx -c Release --no-build
          --coverage --coverage-output-format cobertura
          --results-directory TestResults

      - name: Coverage floor
        shell: pwsh
        # Reads the merged line coverage from ReportGenerator's JSON summary (not the text summary,
        # which is locale-dependent). Fails if there are no reports or the figure is below the floor.
        run: |
          $reports = Get-ChildItem TestResults -Recurse -Filter *.cobertura.xml
          if (-not $reports) { throw "No coverage reports were produced." }
          reportgenerator "-reports:TestResults/**/*.cobertura.xml" "-targetdir:build/dist/coverage" "-reporttypes:JsonSummary"
          if ($LASTEXITCODE -ne 0) { throw "ReportGenerator failed." }
          $summary = Get-Content build/dist/coverage/Summary.json -Raw | ConvertFrom-Json
          $actual = [double]$summary.summary.linecoverage
          $floorText = (Get-Content build/coverage-floor.txt -Raw).Trim()
          $floor = [double]::Parse($floorText, [Globalization.CultureInfo]::InvariantCulture)
          Write-Host "Line coverage $actual% (floor $floor%)"
          if ($actual -lt $floor) { throw "Line coverage $actual% is below the floor of $floor%." }

  installer:
    name: Build installer
    # The gate: tests, JS checks, and the quality gate must pass before any release asset is built.
    needs: [build-and-test, check-js, quality-gate]
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload (chat app)
        run: dotnet workload install maui-windows

      - name: Add GitHub Packages NuGet source (SperryDev.Logger)
        shell: pwsh
        env:
          NUGET_READ_TOKEN: ${{ secrets.TOKENSAVER_READ_TOKEN }}
        run: |
          if (-not $env:NUGET_READ_TOKEN) {
            throw "TOKENSAVER_READ_TOKEN is not set. It must be a classic PAT with read:packages."
          }
          dotnet nuget add source "https://nuget.pkg.github.com/rsperry79/index.json" --name github --username rsperry79 --password $env:NUGET_READ_TOKEN --store-password-in-clear-text

      - name: Install Nerdbank.GitVersioning
        run: dotnet tool install --global nbgv

      - name: Set up Node.js (VS Code extension)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress --limit-output
          }
          if (-not (Test-Path $iscc) -and -not (Test-Path (Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe"))) {
            throw "Inno Setup 6 was not found after installation."
          }

      - name: Build installer
        shell: pwsh
        # No -Version: the version comes from version.json through nbgv, the single version source.
        run: ./installer/build-installer.ps1

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            build/dist/installer/*.exe
            build/dist/installer/*.vsix
            build/dist/installer/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    needs: installer
    # Pushes publish. PRs publish only from this repo: fork PRs get a read-only token.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10 (for nbgv)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Nerdbank.GitVersioning
        run: |
          dotnet tool install --global nbgv
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Resolve version and tag
        id: version
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          version="$(nbgv get-version -v NuGetPackageVersion)"
          tag="v${version}"
          # PRs get their own tag so two open PRs at the same version never overwrite each other's assets.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then tag="v${version}-pr${PR_NUMBER}"; fi
          if [ "$GITHUB_REF_NAME" = "main" ]; then prerelease=false; else prerelease=true; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Release $tag (prerelease: $prerelease) from $GITHUB_SHA"

      - name: Create tag if missing
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # Tags are created by CI from version.json. Never create them by hand.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; leaving it in place."
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist/

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          # Re-running for the same tag updates the existing release's assets.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            prerelease_flag=""
            if [ "$PRERELEASE" = "true" ]; then prerelease_flag="--prerelease"; fi
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "Simple Model Server $TAG" \
              --generate-notes \
              $prerelease_flag
          fi
