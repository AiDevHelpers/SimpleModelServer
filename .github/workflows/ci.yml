name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Add package feeds
        shell: pwsh
        env:
          NUGET_READ_TOKEN: ${{ secrets.TOKENSAVER_READ_TOKEN }}
        run: |
          if (-not $env:NUGET_READ_TOKEN) {
            throw "TOKENSAVER_READ_TOKEN is not set. It must be a classic PAT with read:packages."
          }
          dotnet nuget add source "https://nuget.pkg.github.com/rsperry79/index.json" --name github --username rsperry79 --password $env:NUGET_READ_TOKEN --store-password-in-clear-text
          dotnet nuget add source "https://nuget.pkg.github.com/AiDevHelpers/index.json" --name aidevhelpers --username rsperry79 --password $env:NUGET_READ_TOKEN --store-password-in-clear-text
      - name: Build and test
        shell: pwsh
        run: |
          # MAUI client needs the maui workload and the VS extension needs the VS SDK; both are Windows-only UI builds and are excluded from CI.
          $projects = Get-ChildItem -Recurse -Filter *.csproj | Where-Object { $_.FullName -notmatch '\Chat\.Maui\|\Extensions\.VS' }
          foreach ($p in $projects) { dotnet build $p.FullName --configuration Release; if ($LASTEXITCODE -ne 0) { exit 1 } }
          $tests = $projects | Where-Object { $_.Name -like '*Tests.csproj' }
          foreach ($t in $tests) { dotnet test $t.FullName --configuration Release --no-build; if ($LASTEXITCODE -ne 0) { exit 1 } }
