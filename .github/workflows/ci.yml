name: CI and Release

# Every push and pull request: build the solution, run the tests, build the installer.
# A v* tag additionally publishes a GitHub release with the installer and its SHA-256 checksum.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_XMLDOC_MODE: skip
  # Latest SperryDev.Logger prerelease on wip; latest release on main and on pull requests into main.
  SperryLoggerVersion: ${{ (github.ref_name == 'main' || github.base_ref == 'main') && '0.*' || '0.*-*' }}

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Nerdbank.GitVersioning needs full history to compute the version.
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload (chat app)
        run: dotnet workload install maui-windows

      - name: Add GitHub Packages NuGet source (SperryDev.Logger)
        shell: pwsh
        env:
          NUGET_READ_TOKEN: ${{ secrets.TOKENSAVER_READ_TOKEN }}
        run: |
          if (-not $env:NUGET_READ_TOKEN) {
            throw "TOKENSAVER_READ_TOKEN is not set. It must be a classic PAT with read:packages."
          }
          dotnet nuget add source "https://nuget.pkg.github.com/rsperry79/index.json" --name github --username rsperry79 --password $env:NUGET_READ_TOKEN --store-password-in-clear-text

      - name: Restore
        run: dotnet restore SimpleModelServer.slnx

      - name: Vulnerability audit
        shell: pwsh
        # `dotnet list package --vulnerable` can exit 0 when it finds issues, so check the output too.
        run: |
          $out = dotnet list SimpleModelServer.slnx package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0 -or $out -match 'has the following vulnerable packages') {
            throw "Vulnerable NuGet packages found."
          }

      - name: Build
        run: dotnet build SimpleModelServer.slnx -c Release --no-restore

      - name: Test
        run: >-
          dotnet test SimpleModelServer.slnx -c Release --no-build
          --logger "trx;LogFileName=results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14

  installer:
    name: Build installer
    needs: build-and-test
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload (chat app)
        run: dotnet workload install maui-windows

      - name: Add GitHub Packages NuGet source (SperryDev.Logger)
        shell: pwsh
        env:
          NUGET_READ_TOKEN: ${{ secrets.TOKENSAVER_READ_TOKEN }}
        run: |
          if (-not $env:NUGET_READ_TOKEN) {
            throw "TOKENSAVER_READ_TOKEN is not set. It must be a classic PAT with read:packages."
          }
          dotnet nuget add source "https://nuget.pkg.github.com/rsperry79/index.json" --name github --username rsperry79 --password $env:NUGET_READ_TOKEN --store-password-in-clear-text

      - name: Install Nerdbank.GitVersioning
        run: dotnet tool install --global nbgv

      - name: Set up Node.js (VS Code extension)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress --limit-output
          }
          if (-not (Test-Path $iscc) -and -not (Test-Path (Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe"))) {
            throw "Inno Setup 6 was not found after installation."
          }

      - name: Build installer
        shell: pwsh
        # A tag supplies the version (v1.2.3 -> 1.2.3). Other builds use nbgv's version.
        run: |
          $buildArgs = @()
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $buildArgs += @('-Version', $env:GITHUB_REF_NAME)
          }
          ./installer/build-installer.ps1 @buildArgs

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            build/dist/installer/*.exe
            build/dist/installer/*.vsix
            build/dist/installer/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    needs: installer
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist/

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Re-running the workflow for the same tag must not fail: update the existing
          # release's assets instead of creating a second one.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            prerelease_flag=""
            case "$TAG" in
              *-*) prerelease_flag="--prerelease" ;;
            esac
            gh release create "$TAG" dist/* \
              --title "Simple Model Server $TAG" \
              --generate-notes \
              $prerelease_flag
          fi
