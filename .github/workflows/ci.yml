name: CI and Release

# Tests run on every push, pull request, and manual run.
# Pushes to dev (prerelease) and main (stable) also build the installer and publish a release.
# Pull requests and manual runs never publish. The version comes from version.json through nbgv,
# and CI creates the tag. See the release-versioning rules in the global instructions.

on:
  push:
    branches: [ dev, main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs. Never cancel a run on a branch push, since it may be publishing.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_XMLDOC_MODE: skip

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Nerdbank.GitVersioning needs full history to compute the version.
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload (chat app)
        run: dotnet workload install maui-windows

      - name: Restore
        # The chat app's Windows TFM needs the win-x64 runtime pack at build time. Restoring for
        # the RID downloads it; a plain restore relies on a warm local cache, which runners lack.
        run: dotnet restore SimpleModelServer.slnx --runtime win-x64

      - name: Vulnerability audit
        shell: pwsh
        # `dotnet list package --vulnerable` can exit 0 when it finds issues, so check the output too.
        run: |
          $out = dotnet list SimpleModelServer.slnx package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0 -or $out -match 'has the following vulnerable packages') {
            throw "Vulnerable NuGet packages found."
          }

      - name: Build
        run: dotnet build SimpleModelServer.slnx -c Release --no-restore

      - name: Test
        # --report-trx needs the TRX extension package on the Testing Platform, so it is not used.
        run: dotnet test SimpleModelServer.slnx -c Release --no-build

  check-js:
    name: Check JavaScript (VS Code extension)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/Extensions/SimpleModelServer.Extensions.VSCode
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Extensions/SimpleModelServer.Extensions.VSCode/package-lock.json

      - name: Install (from lockfile)
        run: npm ci

      - name: Check (typecheck, lint, unit tests)
        run: npm run check

  installer:
    name: Build installer
    # The gate: tests and JS checks must pass before any release asset is built.
    needs: [build-and-test, check-js]
    # Branch pushes only: PRs and manual runs never build release assets.
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload (chat app)
        run: dotnet workload install maui-windows

      - name: Install Nerdbank.GitVersioning
        run: dotnet tool install --global nbgv

      - name: Set up Node.js (VS Code extension)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress --limit-output
          }
          if (-not (Test-Path $iscc) -and -not (Test-Path (Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe"))) {
            throw "Inno Setup 6 was not found after installation."
          }

      - name: Build installer
        shell: pwsh
        # No -Version: the version comes from version.json through nbgv, the single version source.
        run: ./installer/build-installer.ps1

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            build/dist/installer/*.exe
            build/dist/installer/*.vsix
            build/dist/installer/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    needs: installer
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10 (for nbgv)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Nerdbank.GitVersioning
        run: |
          dotnet tool install --global nbgv
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Resolve version and tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(nbgv get-version -v NuGetPackageVersion)"
          tag="v${version}"
          if [ "$GITHUB_REF_NAME" = "main" ]; then prerelease=false; else prerelease=true; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Release $tag (prerelease: $prerelease) from $GITHUB_SHA"

      - name: Create tag if missing
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # Tags are created by CI from version.json. Never create them by hand.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; leaving it in place."
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist/

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          # Re-running for the same tag updates the existing release's assets.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            prerelease_flag=""
            if [ "$PRERELEASE" = "true" ]; then prerelease_flag="--prerelease"; fi
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "Simple Model Server $TAG" \
              --generate-notes \
              $prerelease_flag
          fi
