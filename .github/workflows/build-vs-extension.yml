name: Build VS Extension

on:
  push:
    tags:
      - 'v*'
    paths:
      - 'src/Extensions/SimpleModelServer.Extensions.VS/**'
      - 'build/version.props'
      - '.github/workflows/build-vs-extension.yml'
  pull_request:
    paths:
      - 'src/Extensions/SimpleModelServer.Extensions.VS/**'
      - 'build/version.props'
  workflow_dispatch:
    inputs:
      release:
        description: 'Create release'
        required: false
        default: 'false'

jobs:
  build:
    name: Build Extension
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]
        platform: [AnyCPU]

    env:
      PROJECT_PATH: src/Extensions/SimpleModelServer.Extensions.VS/SimpleModelServer.Extensions.VS.csproj
      BUILD_NUMBER: ${{ github.run_number }}
      CI: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -match "^refs/tags/v(.*)$") {
              $version = $matches[1]
          } else {
              # Use a development version scheme
              $version = "1.0.0-dev.${{ env.BUILD_NUMBER }}"
          }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "Version: $version" | Out-Host

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build "${{ env.PROJECT_PATH }}" `
          --configuration ${{ matrix.configuration }} `
          --platform ${{ matrix.platform }} `
          --no-restore `
          -p:Version="${{ steps.version.outputs.VERSION }}"

      - name: Locate VSIX
        id: vsix
        shell: pwsh
        run: |
          $vsixPath = Get-ChildItem -Path "src/Extensions/SimpleModelServer.Extensions.VS/bin/${{ matrix.configuration }}" `
            -Filter "*.vsix" -ErrorAction SilentlyContinue | Select-Object -First 1

          if ($null -eq $vsixPath) {
              Write-Error "No VSIX file found"
              exit 1
          }

          $vsixName = $vsixPath.Name
          $vsixFullPath = $vsixPath.FullName

          echo "VSIX_NAME=$vsixName" >> $env:GITHUB_OUTPUT
          echo "VSIX_PATH=$vsixFullPath" >> $env:GITHUB_OUTPUT
          echo "VSIX found: $vsixName" | Out-Host

      - name: Generate checksum
        shell: pwsh
        run: |
          $filePath = "${{ steps.vsix.outputs.VSIX_PATH }}"
          $checksumPath = $filePath -replace '\.vsix$', '.vsix.sha256'

          $hash = (Get-FileHash -Path $filePath -Algorithm SHA256).Hash
          "$hash  $(Split-Path -Leaf $filePath)" | Out-File -FilePath $checksumPath -Encoding UTF8

          Write-Host "Checksum ($checksumPath):"
          Get-Content $checksumPath

      - name: Create build artifact directory
        shell: pwsh
        run: |
          $outputDir = "build-output/${{ matrix.configuration }}"
          if (-not (Test-Path $outputDir)) {
              New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
          }

          Copy-Item -Path "${{ steps.vsix.outputs.VSIX_PATH }}" `
            -Destination "$outputDir/${{ steps.vsix.outputs.VSIX_NAME }}" -Force

          Copy-Item -Path "${{ steps.vsix.outputs.VSIX_PATH }}" `
            -Destination "$outputDir/${{ steps.vsix.outputs.VSIX_NAME }}.sha256" -Force -ErrorAction SilentlyContinue

          Get-ChildItem $outputDir | Format-Table -AutoSize

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vs-extension-${{ matrix.configuration }}
          path: build-output/${{ matrix.configuration }}/
          retention-days: 30

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare release notes
        shell: pwsh
        run: |
          $version = "${{ github.ref }}" -replace 'refs/tags/v', ''
          $releaseNotes = @"
          # SimpleModelServer VS Extension v$version

          ## What's New
          - Extension version bumped to $version
          - See full changelog: https://github.com/rsperry79/SimpleModelServer/blob/main/CHANGELOG.md

          ## Installation
          1. Open Visual Studio 2022 (17.14 or later)
          2. Go to Extensions > Manage Extensions
          3. Search for "SimpleModelServer"
          4. Click Install

          Or download the VSIX file and:
          1. Open Visual Studio 2022
          2. Extensions > Manage Extensions
          3. Click "Install from File"
          4. Select the downloaded VSIX

          ## Supported Platforms
          - Visual Studio 2022 Community (17.14+)
          - Visual Studio 2022 Professional (17.14+)
          - Visual Studio 2022 Enterprise (17.14+)
          - x64 and ARM64 architectures

          ## Hash Verification
          You can verify the integrity of the VSIX package using the SHA256 checksums provided.
          "@

          $releaseNotes | Out-File -FilePath release-notes.md -Encoding UTF8
          Write-Host "Release notes created"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.vsix
            artifacts/**/*.sha256
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: Verify Build
    runs-on: windows-latest
    needs: build

    steps:
      - name: Download Release artifacts
        uses: actions/download-artifact@v4
        with:
          name: vs-extension-Release

      - name: Verify VSIX
        shell: pwsh
        run: |
          $vsixFiles = @(Get-ChildItem -Filter "*.vsix" -ErrorAction SilentlyContinue)

          if ($vsixFiles.Count -eq 0) {
              Write-Error "No VSIX file found for verification"
              exit 1
          }

          foreach ($vsix in $vsixFiles) {
              Write-Host "Verifying VSIX: $($vsix.Name)"
              Write-Host "  Size: $([Math]::Round($vsix.Length / 1MB, 2)) MB"

              # Verify it's a valid ZIP file (VSIX is ZIP format)
              try {
                  Add-Type -AssemblyName System.IO.Compression
                  $zip = [System.IO.Compression.ZipFile]::OpenRead($vsix.FullName)
                  $zip.Dispose()
                  Write-Host "  ✓ Valid VSIX package"
              }
              catch {
                  Write-Error "  ✗ Invalid VSIX package: $_"
                  exit 1
              }
          }

          # Verify checksums if present
          $checksumFiles = @(Get-ChildItem -Filter "*.sha256" -ErrorAction SilentlyContinue)

          if ($checksumFiles.Count -gt 0) {
              Write-Host ""
              Write-Host "Verifying checksums:"
              foreach ($checksum in $checksumFiles) {
                  $content = Get-Content $checksum.FullName
                  Write-Host "  $content"
              }
          }

  publish-artifacts:
    name: Publish to Release
    runs-on: ubuntu-latest
    needs: [build, verify]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    permissions:
      packages: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts/

      - name: Prepare artifacts for publishing
        shell: bash
        run: |
          mkdir -p release-artifacts
          find all-artifacts -name "*.vsix" -exec cp {} release-artifacts/ \;
          find all-artifacts -name "*.sha256" -exec cp {} release-artifacts/ \;
          ls -lh release-artifacts/

      - name: Display artifacts ready for release
        shell: bash
        run: |
          echo "=== Artifacts Ready for Release ==="
          find release-artifacts -type f -exec sh -c 'echo "  - $(basename $1) ($(du -h "$1" | cut -f1))"' _ {} \;
